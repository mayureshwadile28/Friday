<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Friday — Authentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/style.css?v={{ cache_buster or 'login_1.0' }}"/>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(45, 212, 191, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 20% 90%, rgba(168, 85, 247, 0.1) 0%, transparent 50%);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f1f5f9;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      perspective: 1000px;
    }
    .login-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.05),
        0 0 40px -10px rgba(99, 102, 241, 0.2);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #6366f1, #2dd4bf, #a855f7);
    }
    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 20px auto;
    }
    .avatar-glow {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #2dd4bf, #ec4899);
      opacity: 0.75;
      filter: blur(8px);
      animation: pulse-glow 3s ease-in-out infinite alternate;
    }
    @keyframes pulse-glow {
      0% { opacity: 0.5; filter: blur(6px); transform: scale(0.98); }
      100% { opacity: 0.9; filter: blur(12px); transform: scale(1.04); }
    }
    .avatar-img {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      background: #1e293b;
    }
    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .brand-subtitle {
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .lock-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #818cf8;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
      text-align: left;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-label {
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      color: #64748b;
      font-size: 16px;
      pointer-events: none;
    }
    .password-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 13px 44px 13px 40px;
      color: #f8fafc;
      font-family: inherit;
      font-size: 14px;
      transition: all 0.2s ease;
      outline: none;
    }
    .password-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
      background: rgba(15, 23, 42, 1);
    }
    .password-input::placeholder {
      color: #475569;
    }
    .toggle-pass-btn {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 15px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }
    .toggle-pass-btn:hover {
      color: #cbd5e1;
    }
    .btn-submit {
      margin-top: 8px;
      width: 100%;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 13px 20px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      transition: all 0.2s ease;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    .error-banner {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 11px;
      color: #64748b;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      
      <!-- Centered Friday Avatar -->
      <div class="avatar-wrapper">
        <div class="avatar-glow"></div>
        <img 
          src="/static/friday_avatar.gif" 
          alt="Friday Avatar" 
          class="avatar-img"
          onerror="this.onerror=null; this.src='/static/friday_avatar.png';"
        />
      </div>

      <!-- Header -->
      <div class="brand-title">
        Friday
        <span class="lock-badge">🔒 Restricted</span>
      </div>
      <div class="brand-subtitle">
        Enter Master Password to Access Dashboard
      </div>

      <!-- Error notification -->
      {% if error %}
      <div class="error-banner">
        <span>⚠️</span>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <!-- Password form -->
      <form class="login-form" method="POST" action="/login">
        <div class="input-group">
          <label class="input-label" for="password">Master Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔑</span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="password-input" 
              placeholder="Enter your password..." 
              required 
              autofocus
              autocomplete="current-password"
            />
            <button type="button" class="toggle-pass-btn" id="togglePassBtn" title="Show/Hide Password">
              👁️
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit">
          <span>Confirm & Unlock</span>
          <span>➜</span>
        </button>
      </form>

      <div class="footer-note">
        Protected System • Private Access Only
      </div>
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById('togglePassBtn');
    const passInput = document.getElementById('password');
    if (toggleBtn && passInput) {
      toggleBtn.addEventListener('click', () => {
        if (passInput.type === 'password') {
          passInput.type = 'text';
          toggleBtn.textContent = '🙈';
        } else {
          passInput.type = 'password';
          toggleBtn.textContent = '👁️';
        }
      });
    }
  </script>
</body>
</html>
